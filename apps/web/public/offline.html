<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f2ede3" media="(prefers-color-scheme: light)" />
<title>Biblecommit — offline</title>
<style>
  :root { --paper: #0f1115; --ink: #d9d4c7; --pig: 127 152 209; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --paper: #f2ede3; --ink: #1c1a17; --pig: 36 54 95; color-scheme: light; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 44px;
    background: var(--paper); color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif; text-align: center;
  }
  .mark { font-size: 28px; }
  .mark i { color: rgb(var(--pig)); margin-left: .07em; }
  p { margin-top: 18px; font-size: 19px; opacity: .6; }
  button {
    margin-top: 28px; padding: 10px 22px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--ink) 24%, transparent);
    background: none; color: inherit; font: 13px ui-monospace, monospace; cursor: pointer;
  }
</style>
</head>
<body>
  <div>
    <div class="mark">Bible<i>commit</i></div>
    <p>You're offline. Your reading will be here when you're back.</p>
    <button onclick="location.reload()">try again</button>
  </div>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
